ecommerce_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'ecommerce') }}"
      password: "{{ env_var('DBT_PASSWORD', 'ecommerce') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'ecommerce') }}"
      schema: analytics
      threads: 4
